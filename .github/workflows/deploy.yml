name: CI/CD Pipeline

on:
  # Run on pull requests to any branch
  pull_request:
    branches: ["*"]
  # Run on pushes to main and PageRevamp branches
  push:
    branches: [main, PageRevamp]
  # Manual trigger
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  IMAGE_NAME: filipszwerluga-portfolio

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================
  # Code Quality Checks
  # ============================================
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Build project
        run: npm run build

  # ============================================
  # Docker Build (Validation)
  # ============================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          # Use Git SHA for unique tagging
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          BRANCH_NAME=$(echo ${{ github.ref_name }} | sed 's/[^a-zA-Z0-9]/-/g')
          
          # Create local tags for building
          TAGS="${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:${BRANCH_NAME}"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Docker container
        run: |
          # Start the container
          docker run -d --name test-container -p 8080:80 ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
          
          # Wait for container to be ready
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          # Test main page
          curl -f http://localhost:8080/ || exit 1
          
          # Cleanup
          docker stop test-container
          docker rm test-container

      - name: Display build information
        run: |
          echo "✅ Docker image built and tested successfully!"
          echo ""
          echo "Image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "Git SHA: ${{ github.sha }}"
          echo "Short SHA: ${{ steps.meta.outputs.short_sha }}"
          echo "Branch: ${{ steps.meta.outputs.branch }}"

  # ============================================
  # Terraform Validation
  # ============================================
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Display Terraform info
        run: |
          echo "✅ Terraform configuration validated successfully!"
          echo ""
          echo "Terraform version: $(terraform version -json | jq -r '.terraform_version')"

  # ============================================
  # Build for GitHub Pages
  # ============================================
  build:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    needs: [code-quality, docker-build, terraform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ============================================
  # Deploy to GitHub Pages
  # ============================================
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Display deployment info
        run: |
          echo "🚀 Deployment successful!"
          echo ""
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
